name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - index.html
      - main.js
      - package.json
      - fonts/**
      - build/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm install

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Lomdim-ABC-windows
          path: dist/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: לומדים ABC v${{ steps.ver.outputs.v }}
          make_latest: true
          files: dist/*.exe
